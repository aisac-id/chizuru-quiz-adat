name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies (frozen lockfile)
        run: npm ci
      - name: Lint (300 LoC limit + forbidden patterns)
        run: node scripts/lint.mjs
      - name: Anti-hardcode scan
        run: node scripts/check-hardcode.mjs
      - name: Runtime dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm test
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
